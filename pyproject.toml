[project]
name = "ai-agent-test"
version = "0.1.0"
description = "基于 LangGraph 的多智能体工程助手：Supervisor 编排 + MCP 工具层 + 百炼知识库"
readme = "README.md"
authors = [
    { name = "bandonthrun", email = "xwu73049@usc.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "alibabacloud-bailian20231229==1.8.2",
    "bs4>=0.0.2",
    "dashscope>=1.27.4",
    "fastapi>=0.115",
    "langchain>=1.3.14",
    "langchain-experimental>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "langgraph-checkpoint-redis>=0.5.2",
    "langgraph-supervisor>=0.0.31",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.2",
    "selenium>=4.49.0",
    "sqlglot>=26",
    "uvicorn>=0.30",
]

[project.scripts]
agent = "ai_agent_test.cli:main"
ai-agent-test = "ai_agent_test.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# RUF 只挑有用的几条：全集会把中文注释里的全角标点也报出来，噪音远大于价值
select = ["E", "F", "W", "I", "UP", "SIM", "RUF015", "RUF012"]
ignore = [
    # MCP 工具捕获异常后把错误字符串返回给 LLM，是有意设计：
    # 模型需要可读的错误信息才能自我修正，这里不该上抛
    "BLE001",
    "TRY002",
    # subprocess 返回码由调用方决定语义（工具把 stderr 返回给模型）
    "PLW1510",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
