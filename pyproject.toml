[project]
name = "ai-agent-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bandonthrun", email = "xwu73049@usc.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.14",
    "langchain-experimental>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "langgraph-checkpoint-redis>=0.5.2",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[project.scripts]
ai-agent-test = "ai_agent_test:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
